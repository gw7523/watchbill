[project]
name = "watchbill"
version = "0.1.0"
description = "Cockpit CLI that catalogs, parks, restores and upgrades fleets of long-running coding agents in Herdr, tmux and cmux, across machines."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Jack Holloway" }]
keywords = ["herdr", "tmux", "cmux", "coding-agents", "claude-code", "codex", "fleet", "cockpit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# stdlib only at runtime. pydantic is an optional extra for roster validation.
dependencies = []

[project.optional-dependencies]
validate = ["pydantic>=2,<3"]

[project.scripts]
watchbill = "watchbill.cli:main"

[project.urls]
Homepage = "https://github.com/gw7523/watchbill"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchbill"]

[dependency-groups]
dev = [
  "pytest>=8",
  "jsonschema>=4.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "pitfall: encodes one of the numbered Herdr 0.8.2 pitfalls from the build contract",
  "live: runs against a real multiplexer on this box; skipped when none is running",
]

[tool.uv]
package = true
